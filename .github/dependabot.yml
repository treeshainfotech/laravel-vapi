version: 2

updates:
  # The SDK this package wraps ships sporadically and has published a major
  # bump on the Python side; an open PR here is the earliest signal that the
  # PHP SDK moved. The drift tests in tests/ run against it on every PR.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
